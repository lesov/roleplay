<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1496 DR Sea of Fallen Stars</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="char-creation-overlay" class="char-overlay" role="dialog" aria-modal="true" aria-labelledby="char-creation-title">
      <div id="char-wizard" class="char-wizard"></div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-label="Character sheet">
      <div class="sheet-modal">
        <div class="sheet-modal-header">
          <h2>Character Sheet</h2>
          <button class="icon-button" id="sheet-close" type="button" title="Close" aria-label="Close character sheet">x</button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <div id="narrator-overlay" class="sheet-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="narrator-title">
      <div class="sheet-modal narrator-modal">
        <div class="sheet-modal-header">
          <h2 id="narrator-title">Narrator Brief</h2>
          <button class="icon-button" id="narrator-close" type="button" title="Close" aria-label="Close narrator brief">x</button>
        </div>
        <textarea id="narrator-text" class="narrator-text" readonly aria-label="Copyable narrator brief"></textarea>
        <div class="narrator-actions">
          <p id="narrator-status" class="narrator-status" aria-live="polite"></p>
          <button class="text-button" id="narrator-copy" type="button">Copy</button>
        </div>
      </div>
    </div>

    <div id="travel-overlay" class="travel-overlay" hidden role="dialog" aria-modal="true" aria-label="Journey in progress">
      <div class="travel-modal">
        <p class="travel-eyebrow" id="travel-stage"></p>
        <h2 id="travel-title"></h2>
        <div class="travel-track">
          <span class="travel-segments" id="travel-segments"></span>
          <span class="travel-marker" id="travel-marker" aria-hidden="true">&#9679;</span>
        </div>
        <div class="travel-ends">
          <span id="travel-origin"></span>
          <span id="travel-dest"></span>
        </div>
        <div class="travel-legend" aria-hidden="true">
          <span class="travel-legend-item"><span class="travel-swatch travel-seg--safe"></span>Safe</span>
          <span class="travel-legend-item"><span class="travel-swatch travel-seg--caution"></span>Caution</span>
          <span class="travel-legend-item"><span class="travel-swatch travel-seg--danger"></span>Dangerous</span>
        </div>
        <p class="travel-progress" id="travel-progress"></p>
        <p class="travel-danger" id="travel-danger"></p>
        <p class="travel-vignette" id="travel-vignette"></p>
        <p class="travel-meta" id="travel-meta"></p>
        <button id="travel-skip" type="button" class="wiz-primary">Skip ahead</button>
      </div>
    </div>
    <main class="shell" hidden>
      <section class="world-pane" aria-labelledby="place-name">
        <div class="map" id="map" aria-label="Sea of Fallen Stars travel map"></div>
        <div class="place">
          <p class="year" id="year"></p>
          <h1 id="place-name"></h1>
          <p class="epithet" id="place-epithet"></p>
          <p class="description" id="place-description"></p>
          <p class="weather" id="weather" aria-label="Current weather"></p>
        </div>
      </section>

      <section class="action-pane" aria-label="Travel and city actions">
        <div class="panel character-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Adventurer</p>
              <h2 id="character-name"></h2>
            </div>
            <div class="panel-actions">
              <button class="text-button" id="narrator-brief" type="button">Narrator brief</button>
              <button class="text-button" id="view-sheet" type="button">View sheet</button>
            </div>
          </div>
          <p id="character-summary"></p>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Roads</h2>
          </div>
          <div class="button-grid" id="travel-options"></div>
        </div>

        <div class="panel places">
          <div class="panel-header">
            <h2>Places</h2>
          </div>
          <div class="button-grid" id="location-options"></div>
          <div id="location-detail" class="location-detail"></div>
          <div class="button-grid topics" id="dialogue-options"></div>
        </div>

        <div class="panel world-affairs">
          <div class="panel-header">
            <h2>Known Rumors</h2>
          </div>
          <ol class="news-list" id="world-news"></ol>
        </div>

        <div class="panel codex">
          <div class="panel-header">
            <h2>Codex</h2>
          </div>
          <select id="codex-section" aria-label="Codex section"></select>
          <div id="codex-content" class="codex-content"></div>
        </div>
      </section>

      <section class="log-pane" aria-label="Adventure log">
        <div class="panel log-panel">
          <div class="panel-header">
            <h2>Log</h2>
            <button class="icon-button" id="clear-log" type="button" title="Clear log" aria-label="Clear log">x</button>
          </div>
          <ol id="log"></ol>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
