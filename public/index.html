<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1496 DR Sword Coast</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="char-creation-overlay" class="char-overlay" role="dialog" aria-modal="true" aria-labelledby="char-creation-title">
      <form id="char-creation-form" class="char-panel" novalidate>
        <p class="char-era">1496 DR — Sword Coast</p>
        <h1 id="char-creation-title">Create Your Adventurer</h1>
        <div class="char-fields">
          <label for="char-name">Name</label>
          <input id="char-name" type="text" maxlength="40" required autocomplete="off" placeholder="Enter your name">
          <label for="char-race">Race</label>
          <select id="char-race"></select>
          <label for="char-class">Class</label>
          <select id="char-class"></select>
          <label for="char-background">Background</label>
          <select id="char-background"></select>
        </div>
        <p id="char-error" class="char-error" hidden></p>
        <button type="submit" id="begin-adventure">Begin Adventure</button>
      </form>
    </div>
    <main class="shell" hidden>
      <section class="world-pane" aria-labelledby="place-name">
        <div class="map" id="map" aria-label="Sword Coast travel map"></div>
        <div class="place">
          <p class="year" id="year"></p>
          <h1 id="place-name"></h1>
          <p class="epithet" id="place-epithet"></p>
          <p class="description" id="place-description"></p>
        </div>
      </section>

      <section class="action-pane" aria-label="Travel and tavern actions">
        <div class="panel">
          <div class="panel-header">
            <h2>Roads</h2>
          </div>
          <div class="button-grid" id="travel-options"></div>
        </div>

        <div class="panel tavern">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Tavern</p>
              <h2 id="tavern-name"></h2>
            </div>
            <span id="innkeeper-name"></span>
          </div>
          <p id="tavern-intro"></p>
          <div class="button-grid topics" id="dialogue-options"></div>
        </div>

        <div class="panel world-affairs">
          <div class="panel-header">
            <h2>World Affairs</h2>
          </div>
          <ol class="news-list" id="world-news"></ol>
        </div>

        <div class="panel codex">
          <div class="panel-header">
            <h2>Codex</h2>
          </div>
          <select id="codex-section" aria-label="Codex section"></select>
          <div id="codex-content" class="codex-content"></div>
        </div>
      </section>

      <section class="log-pane" aria-label="Adventure log">
        <div class="panel log-panel">
          <div class="panel-header">
            <h2>Log</h2>
            <button class="icon-button" id="clear-log" type="button" title="Clear log" aria-label="Clear log">x</button>
          </div>
          <ol id="log"></ol>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
